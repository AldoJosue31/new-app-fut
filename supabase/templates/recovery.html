<!doctype html>
<html lang="es">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /></head>
  <body style="margin:0;padding:32px 20px;background:#edf3fb;color:#243b4a;font-family:Arial,sans-serif;">
    <div style="max-width:480px;margin:0 auto;padding:32px;background:#ffffff;border-radius:16px;">
      <p style="margin:0 0 28px;font-size:20px;font-weight:bold;">Bracket App</p>
      <h1 style="margin:0 0 16px;font-size:26px;line-height:1.25;">Cambia tu contraseña</h1>
      <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">Recibimos una solicitud para restablecer la contraseña de tu cuenta. Abre el enlace para elegir una nueva.</p>
      <p style="margin:0 0 28px;">
        <a href="{{ .RedirectTo }}&amp;token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;padding:14px 22px;background:#1cb0f6;color:#062d43;border-radius:10px;font-size:16px;font-weight:bold;text-decoration:none;">Cambiar contraseña</a>
      </p>
      <p style="margin:0;font-size:14px;line-height:1.6;color:#526574;">El enlace se puede usar una sola vez. Si no solicitaste este cambio, puedes ignorar este correo; tu contraseña seguirá funcionando.</p>
    </div>
  </body>
</html>
